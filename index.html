<style>
:root{--bg:#f3f1ec;--card:#fff;--fg:#1d2420;--mut:#66706a;--line:#dcd8cf;--acc:#0f5c4d;--tag:#e6efe9;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2320;--fg:#e9ece8;--mut:#9aa59e;--line:#2e3632;--acc:#7fd0b8;--tag:#24302b;--on:#10201b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:0 0 calc(40px + env(safe-area-inset-bottom))}
header{padding:calc(20px + env(safe-area-inset-top)) 16px 10px}
h1{font-size:26px;margin:0 0 2px}
.sub{color:var(--mut);margin:0;font-size:13px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none;background:var(--card);white-space:nowrap}
h2{font-size:13px;letter-spacing:.14em;color:var(--mut);margin:26px 16px 10px}
.h{background:var(--card);border-block:1px solid var(--line);margin-bottom:18px;scroll-margin-top:62px}
.pw{position:relative}
.ph{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ph::-webkit-scrollbar{display:none}
.ph img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;background:var(--tag);display:block}
.ct{position:absolute;right:10px;bottom:10px;font-size:12px;line-height:1;padding:5px 9px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.ph:empty+.ct{display:none}
.b{padding:14px 16px 18px}
.area{display:inline-block;font-size:12px;background:var(--tag);color:var(--acc);padding:2px 10px;border-radius:99px;margin-bottom:6px}
h3{font-size:21px;line-height:1.3;margin:0}
.vibe{margin:8px 0 12px}
dl{margin:0;font-size:15.5px}
dt{color:var(--mut);font-size:12.5px;margin-top:10px}dd{margin:0}
.lk{margin-top:16px;display:flex;gap:10px}
.lk a{flex:1;text-align:center;padding:12px 8px;border-radius:10px;font-size:15.5px;text-decoration:none;border:1px solid var(--acc);color:var(--acc)}
.lk a.p{background:var(--acc);color:var(--on)}
.cr{display:block;margin-top:10px;font-size:12px;color:var(--mut)}
footer{font-size:12.5px;color:var(--mut);margin:24px 16px 0;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
